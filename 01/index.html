<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박은현 사용설명서</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
    background:linear-gradient(135deg,#fff6fb,#fff9e8,#eef9ff);
    color:#333;
  }
  .wrap{
    width:min(1100px,92%);
    margin:40px auto;
  }
  .hero{
    background:white;
    border-radius:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.12);
    overflow:hidden;
    display:grid;
    grid-template-columns:1.1fr .9fr;
  }
  .photo{
    min-height:600px;
    background:#f9dfe8;
  }
  .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .content{
    padding:42px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .eyebrow{
    font-size:18px;
    font-weight:800;
    color:#ff6d9d;
    margin-bottom:8px;
  }
  h1{
    font-size:48px;
    margin:0 0 8px;
    color:#4e4b78;
  }
  .sub{
    font-size:21px;
    font-weight:700;
    margin-bottom:28px;
  }
  .card{
    border-radius:22px;
    padding:20px;
    margin:10px 0;
  }
  .pink{background:#ffe3ee}
  .green{background:#e2f8ec}
  .yellow{background:#fff3c4}
  .purple{background:#eee6ff}
  .card h2{
    margin:0 0 10px;
    font-size:22px;
  }
  .card p{
    margin:0;
    font-size:18px;
    line-height:1.7;
    font-weight:700;
  }
  button{
    margin-top:20px;
    border:none;
    border-radius:18px;
    padding:16px 22px;
    font-size:19px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#ff76a7,#8a7cff);
    cursor:pointer;
    box-shadow:0 10px 24px rgba(129,103,220,.25);
  }
  #msg{
    margin-top:14px;
    min-height:26px;
    font-size:18px;
    font-weight:800;
    text-align:center;
    color:#5b5578;
  }
  @media(max-width:800px){
    .hero{grid-template-columns:1fr}
    .photo{min-height:auto}
    .content{padding:28px 22px}
    h1{font-size:38px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="photo">
        <img src="eunhyun_manual.png" alt="박은현 사용설명서 일러스트">
      </div>

      <div class="content">
        <div class="eyebrow">😘 나를 표현하는 이모지</div>
        <h1>박은현 사용설명서</h1>
        <div class="sub">나를 잘 사용하는 방법 💗</div>

        <div class="card pink">
          <h2>❤️ 내가 좋아하는 것</h2>
          <p>🐶 강아지 · 🍓 딸기</p>
        </div>

        <div class="card purple">
          <h2>⭐ 내가 잘하는 것</h2>
          <p>🛌 누워있기 😴</p>
        </div>

        <div class="card green">
          <h2>🔋 기분이 안 좋을 때</h2>
          <p>🙏 기도하거나 🎧 CCM 듣기<br>그러면 마음이 다시 충전돼요.</p>
        </div>

        <div class="card yellow">
          <h2>⚠️ 나를 대할 때 주의할 점</h2>
          <p>📱 연락두절하면 안돼요!<br>연락은 꼭 해주세요 😆</p>
        </div>

        <button onclick="todayMe()">오늘의 나 알아보기 ✨</button>
        <div id="msg"></div>
      </div>
    </section>
  </div>

<script>
function todayMe(){
  const list=[
    "오늘은 딸기처럼 상큼한 날 🍓",
    "오늘은 강아지처럼 포근한 날 🐶",
    "지금은 잠깐 누워서 충전할 시간 😴",
    "기도와 CCM으로 마음 배터리 충전 완료 🙏🎧",
    "연락 잘 되는 사람이 최고예요 📱💗"
  ];
  document.getElementById("msg").textContent=
    list[Math.floor(Math.random()*list.length)];
}
</script>
</body>
</html>
