<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김하늘 사용설명서</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background: linear-gradient(135deg, #fff7d6, #f9efff 55%, #eaf8ff);
      padding: 24px;
      color: #30354a;
    }
    .page {
      width: min(920px, 100%);
      background: rgba(255,255,255,.95);
      border: 5px solid #8ec5ff;
      border-radius: 34px;
      box-shadow: 0 20px 50px rgba(83, 115, 163, .18);
      overflow: hidden;
    }
    .topbar {
      background: #dff1ff;
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      border-bottom: 3px solid #b9ddff;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    .dot:nth-child(1){ background:#ff6f91; }
    .dot:nth-child(2){ background:#ffd166; }
    .dot:nth-child(3){ background:#72d98b; }

    .content {
      padding: 34px;
      text-align: center;
    }
    .hero-cat {
      font-size: 78px;
      margin-bottom: -8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 60px);
      font-weight: 900;
      letter-spacing: -2px;
      color: #4675c9;
    }
    .subtitle {
      font-size: clamp(18px, 2.8vw, 24px);
      font-weight: 800;
      margin: 8px 0 28px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }
    .card {
      border-radius: 26px;
      padding: 24px 20px;
      text-align: left;
      min-height: 220px;
    }
    .pink { background: #ffe1ec; }
    .green { background: #dff7df; }
    .yellow { background: #fff0b8; }

    .card h2 {
      margin: 0 0 16px;
      font-size: 23px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      font-size: 19px;
      font-weight: 800;
    }
    .emoji {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 16px;
      font-size: 28px;
      box-shadow: 0 5px 12px rgba(0,0,0,.07);
      flex: 0 0 48px;
    }
    .note {
      font-size: 17px;
      line-height: 1.6;
      font-weight: 700;
      background: rgba(255,255,255,.7);
      border-radius: 18px;
      padding: 14px;
    }
    button {
      border: 0;
      background: linear-gradient(135deg, #5daeff, #7f84ff);
      color: white;
      font-size: 21px;
      font-weight: 900;
      padding: 17px 28px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(83, 113, 255, .28);
      transition: .2s ease;
    }
    button:hover { transform: translateY(-2px) scale(1.02); }

    #result {
      margin: 20px auto 0;
      min-height: 62px;
      max-width: 560px;
      background: #f4f8ff;
      border: 3px dashed #9fc9ff;
      border-radius: 20px;
      padding: 16px 20px;
      font-size: 19px;
      font-weight: 800;
      display: none;
    }
    .footer {
      margin-top: 26px;
      font-size: 14px;
      color: #7c8297;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .content { padding: 26px 18px; }
      .cards { grid-template-columns: 1fr; }
      .card { min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <section class="content">
      <div class="hero-cat">🐱</div>
      <h1>김하늘 사용설명서</h1>
      <div class="subtitle">나를 잘 사용하는 방법 😎</div>

      <div class="cards">
        <article class="card pink">
          <h2>❤️ 내가 좋아하는 것</h2>
          <div class="item"><span class="emoji">🌶️</span>떡볶이</div>
          <div class="item"><span class="emoji">🐱</span>고양이</div>
          <div class="item"><span class="emoji">🎮</span>게임</div>
        </article>

        <article class="card green">
          <h2>🔋 충전이 필요할 때</h2>
          <div class="item"><span class="emoji">🎧</span>혼자 음악 듣기</div>
          <div class="note">
            조용히 음악을 들으면 기분이 다시 좋아져요.<br>
            잠깐 혼자 있는 시간도 필요해요!
          </div>
        </article>

        <article class="card yellow">
          <h2>⚠️ 주의사항</h2>
          <div class="item"><span class="emoji">🌅</span>아침에는</div>
          <div class="note">
            말이 별로 없습니다 😂<br>
            조금만 기다려 주세요.<br>
            시간이 지나면 정상 작동!
          </div>
        </article>
      </div>

      <button onclick="showToday()">오늘의 나 알아보기 ✨</button>
      <div id="result"></div>

      <div class="footer">🐾 KIM HANEUL USER MANUAL</div>
    </section>
  </main>

  <script>
    const messages = [
      "오늘의 하늘이는 고양이처럼 느긋한 모드예요 🐱",
      "오늘은 떡볶이 에너지 100%! 🌶️",
      "게임 한 판 하면 기분이 좋아질지도 몰라요 🎮",
      "지금은 음악 충전이 필요한 시간이에요 🎧",
      "아침이라면 잠시만 기다려 주세요... 부팅 중 😂"
    ];

    function showToday() {
      const result = document.getElementById("result");
      const message = messages[Math.floor(Math.random() * messages.length)];
      result.textContent = message;
      result.style.display = "block";
    }
  </script>
</body>
</html>
